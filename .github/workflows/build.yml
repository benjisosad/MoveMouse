name: Build and optional signing

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      sign:
        description: Request SignPath signing (requires approval and configuration)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 10
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Build unsigned executable
        shell: powershell
        run: .\build.ps1

      - name: Read and validate product version
        id: version
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $info = (Get-Item '.\dist\MoveMouse.exe').VersionInfo
          if ($info.ProductName -ne 'MoveMouse' -or
              $info.ProductVersion -notmatch '^\d+\.\d+\.\d+\.\d+$' -or
              $info.ProductVersion -ne $info.FileVersion) {
              throw 'Unexpected product name or version metadata.'
          }
          "version=$($info.ProductVersion)" >> $env:GITHUB_OUTPUT

      - name: Upload unsigned build
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: MoveMouse-unsigned
          archive: true
          path: |
            dist/MoveMouse.exe
            dist/LEEME.txt
            dist/LICENSE
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  sign:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.sign && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    needs: build
    runs-on: windows-2022
    timeout-minutes: 45
    environment: signpath
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check signing configuration
        shell: powershell
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('SIGNPATH_API_TOKEN', 'SIGNPATH_ORGANIZATION_ID',
              'SIGNPATH_PROJECT_SLUG', 'SIGNPATH_SIGNING_POLICY_SLUG',
              'SIGNPATH_ARTIFACT_CONFIGURATION_SLUG')) {
              if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
                  throw "Missing $name. Complete SIGNPATH_SETUP.md after approval."
              }
          }

      - name: Request manually approved signing
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ needs.build.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: signed
          parameters: |
            version: ${{ toJSON(needs.build.outputs.version) }}

      - name: Verify signature and regenerate checksum
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = '.\signed\MoveMouse.exe'
          $signature = Get-AuthenticodeSignature -FilePath $exe
          if ($signature.Status -ne 'Valid') {
              throw "Invalid Authenticode signature: $($signature.Status)"
          }
          Write-Host "Signer: $($signature.SignerCertificate.Subject)"
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  MoveMouse.exe" | Set-Content '.\signed\SHA256SUMS.txt' -Encoding ascii

      - name: Upload verified signed build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: MoveMouse-signed
          archive: true
          path: |
            signed/MoveMouse.exe
            signed/LEEME.txt
            signed/LICENSE
            signed/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
